<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户对话记录管理</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="theme.css">
    <script src="common.js"></script>
</head>
<body>
<div class="container">
    <header>
        <a href="index.html" class="back-link">← 返回主页</a>
        <h1>用户对话记录管理</h1>
        <p>管理用户对话记录信息</p>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索问题或内容...">
            <button onclick="searchRecords()">搜索</button>
        </div>
        <button class="btn-success" onclick="openCreateModal()">新增记录</button>
    </div>

    <table id="recordsTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>聊天ID</th>
            <th>用户ID</th>
            <th>用户类型</th>
            <th>问题</th>
            <th>内容</th>
            <th>是否启用</th>
            <th>创建时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="recordsTableBody">
        <!-- 数据将通过JS动态填充 -->
        </tbody>
    </table>

    <div class="pagination" id="pagination">
        <!-- 分页控件将通过JS动态生成 -->
    </div>
</div>

<!-- 创建/编辑记录模态框 -->
<div id="recordModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">新增记录</h2>
        </div>
        <div class="modal-body">
            <input type="hidden" id="recordId">
            <div class="form-group">
                <label for="chatId">聊天ID *</label>
                <input type="number" id="chatId" required>
            </div>
            <div class="form-group">
                <label for="userId">用户ID *</label>
                <input type="number" id="userId" required>
            </div>
            <div class="form-group">
                <label for="userType">用户类型 *</label>
                <input type="number" id="userType" required>
            </div>
            <div class="form-group">
                <label for="groupId">组ID</label>
                <input type="text" id="groupId">
            </div>
            <div class="form-group">
                <label for="scopeType">范围类型</label>
                <input type="text" id="scopeType">
            </div>
            <div class="form-group">
                <label for="businessType">业务类型</label>
                <input type="text" id="businessType">
            </div>
            <div class="form-group">
                <label for="question">问题 *</label>
                <input type="text" id="question" required>
            </div>
            <div class="form-group">
                <label for="content">内容 *</label>
                <textarea id="content" required></textarea>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="enabled" checked> 启用
                </label>
            </div>
        </div>
        <div class="modal-footer">
            <button onclick="closeModal()">取消</button>
            <button class="btn-success" onclick="saveRecord()">保存</button>
        </div>
    </div>
</div>

<!-- 通知 -->
<div id="notification" class="notification"></div>

<script>
    // 全局变量
    let currentPage = 0;
    let pageSize = 10;
    let totalElements = 0;
    let totalPages = 0;
    let currentSearch = '';

    // 页面加载完成后获取数据
    document.addEventListener('DOMContentLoaded', function () {
        fetchRecords();
    });

    // 获取记录列表
    function fetchRecords(page = 0) {
        currentPage = page;
        const url = `/api/context-user-record?page=${page}&size=${pageSize}&search=${encodeURIComponent(currentSearch)}`;

        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error('网络响应异常');
                }
                return response.json();
            })
            .then(data => {
                // 根据实际返回的数据结构调整
                const content = data.content || data.items || data.data || data;
                totalElements = data.totalElements || data.total || content.length;
                totalPages = data.totalPages || data.pageCount || Math.ceil(totalElements / pageSize);

                renderTable(content);
                renderPagination();
            })
            .catch(error => {
                console.error('获取数据失败:', error);
                showNotification('获取数据失败: ' + error.message, 'error');
                renderTable([]);
                renderPagination();
            });
    }

    // 搜索记录
    function searchRecords() {
        currentSearch = document.getElementById('searchInput').value.trim();
        fetchRecords(0); // 搜索时回到第一页
    }

    // 渲染表格
    function renderTable(records) {
        const tbody = document.getElementById('recordsTableBody');
        tbody.innerHTML = '';

        if (!records || records.length === 0) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td colspan="9" style="text-align: center;">暂无数据</td>`;
            tbody.appendChild(tr);
            return;
        }

        records.forEach(record => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                    <td>${record.id || '-'}</td>
                    <td>${record.chatId || '-'}</td>
                    <td>${record.userId || '-'}</td>
                    <td>${record.userType || '-'}</td>
                    <td class="content-cell">${record.question || '-'}</td>
                    <td class="content-cell">${record.content || '-'}</td>
                    <td>${record.enabled ? '是' : '否'}</td>
                    <td>${formatDate(record.createTime) || '-'}</td>
                    <td class="actions">
                        <button class="btn-warning" onclick='openEditModal(${JSON.stringify(record).replace(/'/g, "\\'")})'>编辑</button>
                        <button class="btn-danger" onclick="deleteRecord(${record.id})">删除</button>
                    </td>
                `;
            tbody.appendChild(tr);
        });
    }

    // 渲染分页控件
    function renderPagination() {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        if (totalPages <= 1) {
            pagination.style.display = 'none';
            return;
        }

        pagination.style.display = 'flex';

        // 显示分页信息
        const infoDiv = document.createElement('div');
        infoDiv.className = 'pagination-info';
        infoDiv.textContent = `第 ${currentPage + 1} 页，共 ${totalPages} 页，总计 ${totalElements} 条记录`;
        pagination.appendChild(infoDiv);

        // 上一页按钮
        const prevButton = document.createElement('button');
        prevButton.textContent = '上一页';
        if (currentPage === 0) {
            prevButton.classList.add('btn-disabled');
            prevButton.disabled = true;
        } else {
            prevButton.onclick = () => fetchRecords(currentPage - 1);
        }
        pagination.appendChild(prevButton);

        // 页码按钮
        const maxVisiblePages = 5;
        let startPage = Math.max(0, currentPage - Math.floor(maxVisiblePages / 2));
        let endPage = Math.min(totalPages - 1, startPage + maxVisiblePages - 1);

        // 调整起始页，确保显示足够的页码
        if (endPage - startPage + 1 < maxVisiblePages) {
            startPage = Math.max(0, endPage - maxVisiblePages + 1);
        }

        // 第一页
        if (startPage > 0) {
            const firstButton = document.createElement('button');
            firstButton.textContent = '1';
            firstButton.onclick = () => fetchRecords(0);
            pagination.appendChild(firstButton);

            if (startPage > 1) {
                const ellipsis = document.createElement('button');
                ellipsis.textContent = '...';
                ellipsis.className = 'ellipsis';
                ellipsis.disabled = true;
                pagination.appendChild(ellipsis);
            }
        }

        // 中间页码
        for (let i = startPage; i <= endPage; i++) {
            const pageButton = document.createElement('button');
            pageButton.textContent = i + 1;
            if (i === currentPage) {
                pageButton.classList.add('current-page');
                pageButton.disabled = true;
            } else {
                pageButton.onclick = () => fetchRecords(i);
            }
            pagination.appendChild(pageButton);
        }

        // 最后一页
        if (endPage < totalPages - 1) {
            if (endPage < totalPages - 2) {
                const ellipsis = document.createElement('button');
                ellipsis.textContent = '...';
                ellipsis.className = 'ellipsis';
                ellipsis.disabled = true;
                pagination.appendChild(ellipsis);
            }

            const lastButton = document.createElement('button');
            lastButton.textContent = totalPages;
            lastButton.onclick = () => fetchRecords(totalPages - 1);
            pagination.appendChild(lastButton);
        }

        // 下一页按钮
        const nextButton = document.createElement('button');
        nextButton.textContent = '下一页';
        if (currentPage === totalPages - 1) {
            nextButton.classList.add('btn-disabled');
            nextButton.disabled = true;
        } else {
            nextButton.onclick = () => fetchRecords(currentPage + 1);
        }
        pagination.appendChild(nextButton);

        // 页面大小选择器
        const pageSizer = document.createElement('div');
        pageSizer.className = 'page-sizer';
        pageSizer.innerHTML = `
                <span>每页显示:</span>
                <select id="pageSizeSelect">
                    <option value="5" ${pageSize === 5 ? 'selected' : ''}>5</option>
                    <option value="10" ${pageSize === 10 ? 'selected' : ''}>10</option>
                    <option value="20" ${pageSize === 20 ? 'selected' : ''}>20</option>
                    <option value="50" ${pageSize === 50 ? 'selected' : ''}>50</option>
                </select>
                <span>条</span>
            `;
        pagination.appendChild(pageSizer);

        // 绑定页面大小改变事件
        document.getElementById('pageSizeSelect').addEventListener('change', function () {
            pageSize = parseInt(this.value);
            fetchRecords(0); // 页面大小改变时回到第一页
        });
    }

    // 打开创建模态框
    function openCreateModal() {
        document.getElementById('modalTitle').textContent = '新增记录';
        document.getElementById('recordId').value = '';
        document.getElementById('chatId').value = '';
        document.getElementById('userId').value = '';
        document.getElementById('userType').value = '';
        document.getElementById('groupId').value = '';
        document.getElementById('scopeType').value = '';
        document.getElementById('businessType').value = '';
        document.getElementById('question').value = '';
        document.getElementById('content').value = '';
        document.getElementById('enabled').checked = true;
        document.getElementById('recordModal').style.display = 'flex';
    }

    // 打开编辑模态框
    function openEditModal(record) {
        document.getElementById('modalTitle').textContent = '编辑记录';
        document.getElementById('recordId').value = record.id || '';
        document.getElementById('chatId').value = record.chatId || '';
        document.getElementById('userId').value = record.userId || '';
        document.getElementById('userType').value = record.userType || '';
        document.getElementById('groupId').value = record.groupId || '';
        document.getElementById('scopeType').value = record.scopeType || '';
        document.getElementById('businessType').value = record.businessType || '';
        document.getElementById('question').value = record.question || '';
        document.getElementById('content').value = record.content || '';
        document.getElementById('enabled').checked = record.enabled !== undefined ? record.enabled : true;
        document.getElementById('recordModal').style.display = 'flex';
    }

    // 关闭模态框
    function closeModal() {
        document.getElementById('recordModal').style.display = 'none';
    }

    // 保存记录
    function saveRecord() {
        const id = document.getElementById('recordId').value;
        const recordData = {
            chatId: document.getElementById('chatId').value ? parseInt(document.getElementById('chatId').value) : null,
            userId: document.getElementById('userId').value ? parseInt(document.getElementById('userId').value) : null,
            userType: document.getElementById('userType').value ? parseInt(document.getElementById('userType').value) : null,
            groupId: document.getElementById('groupId').value ? document.getElementById('groupId').value : null,
            scopeType: document.getElementById('scopeType').value,
            businessType: document.getElementById('businessType').value,
            question: document.getElementById('question').value,
            content: document.getElementById('content').value,
            enabled: document.getElementById('enabled').checked
        };

        const isUpdate = !!id;
        const url = isUpdate ? `/api/context-user-record/${id}` : '/api/context-user-record';
        const method = isUpdate ? 'PUT' : 'POST';

        fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(recordData)
        })
            .then(response => {
                if (response.ok) {
                    return response.json();
                }
                throw new Error('保存失败');
            })
            .then(() => {
                closeModal();
                fetchRecords(currentPage);
                showNotification(isUpdate ? '更新成功' : '创建成功', 'success');
            })
            .catch(error => {
                showNotification('保存失败: ' + error.message, 'error');
            });
    }

    // 删除记录
    async function deleteRecord(id) {
        if (!await confirmDialog('确定要删除这条记录吗？', '删除确认')) {
            return;
        }

        fetch(`/api/context-user-record/${id}`, {
            method: 'DELETE'
        })
            .then(response => {
                if (response.ok) {
                    // 如果当前页只剩一个元素且不是第一页，删除后返回上一页
                    if (document.getElementById('recordsTableBody').children.length === 1 && currentPage > 0) {
                        fetchRecords(currentPage - 1);
                    } else {
                        fetchRecords(currentPage);
                    }
                    showNotification('删除成功', 'success');
                } else {
                    throw new Error('删除失败');
                }
            })
            .catch(error => {
                showNotification('删除失败: ' + error.message, 'error');
            });
    }

    // 格式化日期
    function formatDate(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');
        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }

    // 显示通知
    function showNotification(message, type) {
        const notification = document.getElementById('notification');
        notification.textContent = message;
        notification.className = 'notification ' + type;
        notification.style.display = 'block';

        setTimeout(() => {
            notification.style.display = 'none';
        }, 3000);
    }

    // 点击模态框外部关闭
    window.onclick = function (event) {
        const modal = document.getElementById('recordModal');
        if (event.target === modal) {
            closeModal();
        }
    }

    // 支持回车键搜索
    document.getElementById('searchInput').addEventListener('keyup', function (event) {
        if (event.key === 'Enter') {
            searchRecords();
        }
    });
</script>
</body>
</html>
