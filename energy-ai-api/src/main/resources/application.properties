spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3.6:9b
##本应用mcp服务
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=energy-ai-mcp-server
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.streamable-http.keep-alive-interval=30s
#spring.ai.mcp.server.sse-message-endpoint=/mcp/message
##远程mcp服务 如无远程mcp服务，注释下列client内容
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.initialized=true
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.fix.connections.base-ai-mcp-server.url=http://localhost:8004
spring.ai.mcp.client.streamable-http.fix.connections.base-ai-mcp-server.endpoint=/mcp/sse
spring.ai.mcp.client.request-timeout=20s
#不适用sse，断连不重连，使用最新支持的streamable
#spring.ai.mcp.client.sse.fix.connections.base-ai-mcp-server.url=http://localhost:8004
#spring.ai.mcp.client.sse.fix.connections.base-ai-mcp-server.sse-endpoint=/mcp/sse
#本地工具mcp 暂用不上
#spring.ai.mcp.client.stdio.servers-configuration=mcp-servers.json
## MCP Server auth (per-server tokens, pair with each server's auth filter)
## Option 1: single global token for ALL MCP servers
##   server.mcp.token=your-token-here
## Option 2: per-server rules (different tokens per endpoint; longest-prefix match)
ai.mcp.client.auth.rules[0].url-prefix=http://localhost:8004
ai.mcp.client.auth.rules[0].token=your-token-here
## MCP tool configs
ai.mcp.amap.api-key=${spring.ai.dashscope.api-key}
ai.mcp.amap.endpoint=https://dashscope.aliyuncs.com/api/v1/mcps/amap-maps/mcp
ai.mcp.weather.api-key=${spring.ai.dashscope.api-key}
ai.mcp.weather.endpoint=https://dashscope.aliyuncs.com/api/v1/mcps/market-cmapi013828/mcp
ai.mcp.webparser.api-key=${spring.ai.dashscope.api-key}
ai.mcp.webparser.endpoint=https://dashscope.aliyuncs.com/api/v1/mcps/WebParser/sse
ai.mcp.websearch.api-key=${spring.ai.dashscope.api-key}
ai.mcp.websearch.enabled=true
ai.mcp.websearch.endpoint=https://dashscope.aliyuncs.com/api/v1/mcps/WebSearch/mcp
ai.mcp.websearch.timeout-seconds=20
## Agent executor config
ai.agent.executor.enabled=true
## Prompt external loading
ai.prompt.external.enabled=true
## Tool configs
ai.tools.http.enabled=true
ai.tools.http.allowed-methods=GET,POST
ai.tools.http.url-whitelist=http://127.0.0.1,http://localhost
